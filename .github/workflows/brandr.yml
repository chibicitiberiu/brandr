# brandr CI: test on every push/PR; on a brandr-v* tag (e.g. brandr-v0.1.0) also build
# the static binaries (i586 + x86_64 musl) and publish them as a GitHub release.
# Tags are prefixed because this fork inherits upstream caligula's v* tags.
name: brandr

on:
  push:
    branches: [main]
    tags: ["brandr-v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/brandr-v')
        run: |
          want="${GITHUB_REF_NAME#brandr-v}"
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $have"; exit 1; }
      - name: Tests
        run: cargo test --locked --bin brandr
      - name: Clippy (report only)
        run: cargo clippy --locked --bin brandr

  static:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [i586, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Build static ${{ matrix.arch }}
        run: scripts/build-static.sh ${{ matrix.arch }}
      - name: Package
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            brandr-v*) version="${GITHUB_REF_NAME#brandr-v}" ;;
            *) version="dev-${GITHUB_SHA::7}" ;;
          esac
          name=brandr-$version-${{ matrix.arch }}-linux-musl
          mkdir -p "pkg/$name"
          cp dist/${{ matrix.arch }}/brandr LICENSE README.md "pkg/$name/"
          # licences of everything statically linked in
          cargo tree --locked -e normal --prefix none --target ${{ matrix.arch }}-unknown-linux-musl \
            --format "{p}  {l}" | sed "s/ (\*)$//" | sort -u > "pkg/$name/THIRD-PARTY.txt"
          printf '\nAlso linked: musl libc (MIT), bzip2 (BSD-like), xz/liblzma (0BSD/public domain)\n' \
            >> "pkg/$name/THIRD-PARTY.txt"
          tar -C pkg -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: brandr-${{ matrix.arch }}
          path: brandr-*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/brandr-v')
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes
